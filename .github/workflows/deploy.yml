name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'angular.json'
      - 'package.json'
      - 'package-lock.json'
      - 'stryker.config.json'
      - 'vitest.stryker.config.mts'
      - 'vitest.setup.ts'
      - 'tsconfig*.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Unit Tests (>=90% Coverage) & Build Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build Angular application
        run: npm run build -- --base-href "${{ steps.pages.outputs.base_path }}/"

      - name: Copy index.html to 404.html (SPA routing fallback)
        run: cp dist/learn-angular/browser/index.html dist/learn-angular/browser/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/learn-angular/browser

  mutation:
    name: Mutation Tests (>=90% Score, Incremental)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restore Stryker incremental cache
        id: stryker-cache
        uses: actions/cache/restore@v4
        with:
          path: reports/mutation/stryker-incremental.json
          key: stryker-inc-main-${{ github.sha }}
          restore-keys: |
            stryker-inc-main-

      - name: Run mutation tests (min 90% score)
        run: npm run test:mutation:ci

      - name: Save Stryker incremental cache
        if: success() && steps.stryker-cache.outputs.cache-hit != 'true' && hashFiles('reports/mutation/stryker-incremental.json') != ''
        uses: actions/cache/save@v4
        with:
          path: reports/mutation/stryker-incremental.json
          key: stryker-inc-main-${{ github.sha }}

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-mutation-report
          path: reports/mutation/
          retention-days: 14

  deploy:
    name: Deploy to GitHub Pages
    needs: [build, mutation]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
