<aside
  class="flex h-screen w-64 shrink-0 flex-col border-r border-ng-border bg-ng-surface text-ng-text"
  aria-label="Menu Lateral"
>
  <!-- Header / Brand -->
  <div class="flex h-16 items-center gap-3 border-b border-ng-border px-5">
    <div
      class="flex h-9 w-9 shrink-0 items-center justify-center rounded-md border border-ng-border bg-ng-bg shadow-[inset_0_1px_0_0_rgba(255,255,255,0.06)]"
    >
      <svg
        class="h-5 w-5"
        viewBox="0 0 223 236"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <defs>
          <linearGradient id="ng-logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#F0060B" />
            <stop offset="50%" stop-color="#CC26D5" />
            <stop offset="100%" stop-color="#7702FF" />
          </linearGradient>
        </defs>
        <path
          fill="url(#ng-logo-grad)"
          d="m222.077 39.192-8.019 125.923L137.387 0l84.69 39.192Zm-53.105 162.825-57.933 33.056-57.934-33.056 11.783-28.556h92.301l11.783 28.556ZM111.039 62.675l30.357 73.803H80.681l30.358-73.803ZM7.937 165.115 0 39.192 84.69 0 7.937 165.115Z"
        />
      </svg>
    </div>
    <div class="min-w-0 flex-1">
      <div class="flex items-center gap-2">
        <span class="truncate font-display text-sm font-semibold tracking-tight text-ng-text">
          Learn Angular
        </span>
        <span
          class="rounded border border-ng-border bg-ng-bg px-1.5 py-0.5 font-mono text-[10px] font-medium text-ng-primary"
        >
          v22
        </span>
      </div>
      <p class="truncate text-[11px] text-ng-text-subtle">Hub de estudos &amp; práticas</p>
    </div>
  </div>

  <!-- Navigation Links -->
  <nav class="flex-1 space-y-1 overflow-y-auto px-3 py-5">
    <div class="px-3 pb-2 font-mono text-[11px] font-medium uppercase tracking-wider text-ng-text-subtle">
      Módulos
    </div>

    @for (item of navItems(); track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="bg-ng-primary/10 text-ng-text border-ng-primary"
        [routerLinkActiveOptions]="{ exact: !!item.exact }"
        class="ui-btn group relative flex flex-col rounded border-l-2 border-transparent px-3 py-2.5 text-sm font-medium text-ng-text-muted hover:bg-ng-surface-hover hover:text-ng-text"
      >
        <span class="flex items-center justify-between gap-2">
          <span>{{ item.label }}</span>
          <span
            class="h-1.5 w-1.5 rounded-full bg-ng-primary opacity-0 transition-opacity group-hover:opacity-50"
            aria-hidden="true"
          ></span>
        </span>
        @if (item.description) {
          <span class="text-xs text-ng-text-subtle group-hover:text-ng-text-muted">
            {{ item.description }}
          </span>
        }
      </a>
    }
  </nav>

  <!-- Footer Info -->
  <div class="border-t border-ng-border p-4 text-xs text-ng-text-subtle">
    <div class="mb-2 h-0.5 w-10 rounded-sm ng-gradient-bar"></div>
    <p class="font-medium text-ng-text">Angular Moderno</p>
    <p class="mt-0.5 font-mono text-[11px] text-ng-text-subtle">Signals • Standalone • Tailwind</p>
  </div>
</aside>
