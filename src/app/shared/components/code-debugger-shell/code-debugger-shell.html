<section
  [attr.aria-label]="ariaLabel()"
  class="ng-code-container rounded-2xl border-2 border-indigo-500/20 bg-ng-code dark:border-indigo-500/30"
>
  <div
    class="flex flex-wrap items-center justify-between gap-3 border-b border-indigo-500/20 bg-ng-surface px-4 py-3 dark:border-indigo-500/30"
  >
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-1.5" aria-hidden="true">
        <span class="h-2.5 w-2.5 rounded-full bg-rose-500"></span>
        <span class="h-2.5 w-2.5 rounded-full bg-amber-400"></span>
        <span class="h-2.5 w-2.5 rounded-full bg-emerald-400"></span>
      </div>
      <div class="flex items-center gap-1.5">
        <span
          class="rounded border border-cyan-500/30 bg-cyan-100 px-2 py-0.5 font-mono text-xs font-bold text-cyan-800 dark:border-cyan-400/50 dark:bg-cyan-950/50 dark:text-cyan-300"
        >
          TS
        </span>
        <span class="font-mono text-sm font-bold text-ng-text">
          {{ fileName() }}
        </span>
      </div>
    </div>

    <div class="flex flex-wrap items-center gap-2">
      <ng-content select="[debuggerHeaderActions]" />

      <span
        [class]="
          'inline-flex items-center gap-1.5 rounded-lg border px-3 py-1 font-mono text-xs font-bold ' +
          breakpointBadgeClasses()
        "
      >
        <span [class]="'h-2 w-2 rounded-full ' + breakpointDotClass()" aria-hidden="true"></span>
        Breakpoint: {{ breakpointLabel() }}
      </span>
    </div>
  </div>

  <div class="space-y-1 overflow-x-auto p-4 font-mono text-sm leading-relaxed">
    <div class="px-3 py-1 text-ng-text-subtle">
      <ng-content select="[debuggerClassHeader]" />
    </div>

    @for (block of blocks(); track block.id) {
      <div
        [attr.data-phase-block]="block.id"
        [class]="
          'rounded-r-lg border-l-4 px-3 py-1.5 transition-colors duration-150 ' +
          (block.isActive ? block.activeClasses : 'border-transparent opacity-45')
        "
      >
        <div class="flex items-center gap-2">
          <span
            [class]="'w-3 text-center ' + (block.isActive ? block.activeTextClass : 'text-transparent')"
            aria-hidden="true"
          >
            ●
          </span>
          <span class="text-ng-info">{{ block.signature }}</span>
          <span class="text-ng-text-subtle">&#123;</span>
        </div>
        <div class="pl-8 text-ng-text-subtle">{{ block.descriptionComment }}</div>
        <div class="pl-8 text-ng-text-muted">{{ block.exampleLine }}</div>
        @if (block.isActive && block.debugLine) {
          <div [class]="'pl-8 text-xs font-semibold ' + block.activeTextClass">
            // [DEBUG] {{ block.debugLine }}
          </div>
        }
        <div class="pl-5 text-ng-text-subtle">{{ block.closingBrace ?? '}' }}</div>
      </div>
    }

    <div class="px-3 py-1 text-ng-text-subtle">&#125;</div>
  </div>
</section>
