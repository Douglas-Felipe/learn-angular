<app-code-debugger-shell
  ariaLabel="Código Angular em Modo Debug"
  fileName="card-demo.component.ts"
  [breakpointLabel]="theme().label"
  [breakpointBadgeClasses]="theme().badgeClasses"
  [breakpointDotClass]="theme().dotClass"
  [blocks]="blockViews()"
>
  <ng-container debuggerClassHeader>
    <div><span class="text-ng-secondary">&#64;Component</span>(&#123; selector: <span class="text-ng-success">'app-card-demo'</span> &#125;)</div>
    <div><span class="text-ng-secondary">export class</span> <span class="text-ng-info">CardDemoComponent</span> &#123;</div>
    <div class="pl-4">
      <span class="text-ng-secondary">readonly</span> texto =
      <span class="text-ng-info">input</span>(<span class="text-ng-success">'{{ inputLiteral() }}'</span>);
    </div>
    <div class="pl-4">
      <span class="text-ng-secondary">readonly</span> usuario =
      <span class="text-ng-info">input</span>(&#123; nome: <span class="text-ng-success">'{{ objectLiteral() }}'</span> &#125;);
      <span class="text-xs text-ng-text-subtle">// ref #{{ objectRefLiteral() }}</span>
    </div>
  </ng-container>
</app-code-debugger-shell>
