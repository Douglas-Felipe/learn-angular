<div class="mx-auto max-w-6xl space-y-6 pb-10">
  <!-- Header -->
  <header class="flex flex-wrap items-center justify-between gap-4 border-b border-ng-border pb-5">
    <div class="space-y-2">
      <h1 class="display-title text-balance text-2xl font-black tracking-tight text-ng-text sm:text-3xl">
        Ciclo de Vida em Modo Debug
      </h1>
      <p class="max-w-2xl text-sm leading-[1.65] text-ng-text-muted">
        Modifique o texto dentro do card e avance passo a passo para ver cada hook do Angular sendo executado ao lado.
      </p>
    </div>

    <!-- Botões Montar e Destruir -->
    <div class="flex items-center gap-3">
      <button
        type="button"
        (click)="mount()"
        aria-label="Montar componente"
        class="cyber-button cyber-button-emerald"
      >
        Montar
      </button>

      <button
        type="button"
        [disabled]="!isMountedTarget()"
        (click)="destroy()"
        aria-label="Destruir componente"
        class="cyber-button cyber-button-rose"
      >
        Destruir
      </button>
    </div>
  </header>

  <!-- Main Two-Column Debug Workspace -->
  <div class="grid grid-cols-1 items-start gap-6 lg:grid-cols-12">
    <!-- Left Column: Demo Card + DOM Execution Tree -->
    <div class="space-y-4 lg:col-span-5">
      <app-demo-card
        [step]="current()"
        [theme]="currentTheme()"
        [stepIndex]="stepIndex()"
        [totalSteps]="steps().length"
        [isPlaying]="isPlaying()"
        [isMountedTarget]="isMountedTarget()"
        [(draftText)]="draftText"
        (prevStep)="prev()"
        (nextStep)="next()"
        (togglePlay)="togglePlay()"
        (submitText)="updateText()"
      />

      <app-dom-tree
        [hook]="current().hook"
        [mounted]="current().mounted"
        [domText]="current().domText"
        [memoryText]="current().memoryText"
        [cycleHooks]="cycleHookIds()"
        (selectHook)="goToHook($event)"
      />
    </div>

    <!-- Right Column: Angular Component Code in Debug Mode -->
    <app-code-debugger
      class="block lg:col-span-7"
      [step]="current()"
      [theme]="currentTheme()"
      [draftText]="draftText()"
    />
  </div>
</div>
